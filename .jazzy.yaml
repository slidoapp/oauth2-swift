# Jazzy config
module:      OAuth2

author:      Pascal Pfiffner
author_url:  https://github.com/p2
root_url:    https://p2.github.io/OAuth2
github_url:  https://github.com/p2/OAuth2

theme:       fullwidth
readme:      README.md

custom_categories:
  - name: Client
    children:
      - OAuth2Client
      - OAuth2ResourceClient

  - name: Configuration and Credentials
    children:
      - OAuth2ClientConfiguration
      - OAuth2ClientAuthentication
      - OAuth2ClientCredentials
      - OAuth2CredentialRecord
      - OAuth2KeychainConfiguration
      - OAuth2KeychainCredentialStore
      - InMemoryOAuth2CredentialStore

  - name: Tokens and Registration
    children:
      - OAuth2TokenSet
      - OAuth2TokenSnapshot
      - OAuth2TokenResponse
      - OAuth2TokenResponseFormat
      - OAuth2ClientRegistration
      - OAuth2ClientRegistrationResponse
      - OAuth2DeviceAuthorization
      - JSONValue

  - name: Concurrency Boundaries
    children:
      - OAuth2Transport
      - URLSessionOAuth2Transport
      - OAuth2CredentialStore
      - OAuth2Clock
      - SystemOAuth2Clock
      - OAuth2Sleeper
      - SystemOAuth2Sleeper
      - OAuth2Randomness
      - SystemOAuth2Randomness

  - name: Interactive Authorization
    children:
      - OAuth2AuthorizationPresenter
      - OAuth2AuthorizationPresentationRequest
      - OAuth2AuthenticationSessionPresenter
      - OAuth2ImplicitResponseLocation

  - name: HTTP and Errors
    children:
      - OAuth2HTTPResponse
      - OAuth2ClientError
      - OAuth2KeychainError
