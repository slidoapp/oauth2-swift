name: build

on:
  push:
  pull_request:
    branches: [ 'main' ]

permissions:
  contents: read
  checks: write

jobs:
  build-swift:
    strategy:
      fail-fast: false
      matrix:
        swift: ['swift6.2']
        include:
          - swift: 'swift6.2'
            xcode-path: '/Applications/Xcode_26.2.app'
            macos: 'macos-26'
    
    env:
      DEVELOPER_DIR: ${{ matrix.xcode-path }}

    runs-on: ${{ matrix.macos }}

    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        submodules: true

    - name: swift version
      run: swift --version

    - name: build
      run: swift build -v

    - name: run unit tests
      continue-on-error: true
      run: |
        mkdir reports
        swift test --parallel --xunit-output 'reports/TestReport.xml'
  
    - name: report unit test results
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
      if: always()
      id: results-swift-tests
      with:
        name: 'results-swift-tests-${{ matrix.swift }}'
        path: 'reports/TestReport.xml'
        reporter: swift-xunit
        fail-on-error: true

    - name: summary
      if: always()
      run: |
        {
          echo "# Test Summary Report"
          echo ""
          echo "System details"
          echo ""
          echo "Swift: \`${{ matrix.swift }}\`  "
          echo "macOS: \`${{ matrix.macos }}\`  "
          echo "Xcode: \`${{ matrix.xcode-path }}\` "
          echo ""
          echo "Unit Tests Conclusion: \`${{ steps.results-swift-tests.outputs.conclusion }}\`  "
          echo "Unit Tests Report: <${{ steps.results-swift-tests.outputs.url_html }}>"
        } >> $GITHUB_STEP_SUMMARY

  build-xcode:
    name: 'build-xcode (${{ matrix.platform }})'

    strategy:
      fail-fast: false
      matrix:
        macos: [ 'macos-26' ]
        platform: [ 'macOS', 'iOS', 'tvOS' ]
        include:
          - platform: 'macOS'
            scheme: 'OAuth2macOS'
            destination: 'platform=macOS'
          - platform: 'iOS'
            scheme: 'OAuth2iOS'
            destination: 'generic/platform=iOS Simulator'
          - platform: 'tvOS'
            scheme: 'OAuth2tvOS'
            destination: 'generic/platform=tvOS Simulator'
    
    env:
      DEVELOPER_DIR: '/Applications/Xcode_26.2.app'
      TEST_RESULTS_PATH: 'OAuth2Tests_${{ matrix.platform }}_run${{ github.run_number }}.xcresult'

    runs-on: ${{ matrix.macos }}

    steps:
    - name: checkout
      uses: actions/checkout@v7.0.1
      with:
        submodules: true

    - name: xcode version
      run: xcodebuild -version

    - name: swift version
      run: swift --version

    - name: build
      run: >
        xcodebuild
        -scheme '${{ matrix.scheme }}'
        -configuration Debug
        -destination '${{ matrix.destination }}'
        -showBuildTimingSummary
        build

    - name: test
      if: success() && matrix.platform == 'macOS'
      continue-on-error: true
      run: >
        xcodebuild
        -scheme '${{ matrix.scheme }}'
        -configuration Debug
        -destination '${{ matrix.destination }}'
        -resultBundlePath ${{ env.TEST_RESULTS_PATH }}
        test

    - name: run xcresulttool
      uses: slidoapp/xcresulttool@v3.1.2
      if: always() && matrix.platform == 'macOS'
      with:
        title: 'results-xcode-tests-${{ matrix.platform }}'
        path: ${{ env.TEST_RESULTS_PATH }}
        upload-bundles: always
